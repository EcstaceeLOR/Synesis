name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synesis
          POSTGRES_PASSWORD: synesis
          POSTGRES_DB: synesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synesis -d synesis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://synesis:synesis@localhost:5432/synesis_test
      WORKER_DATABASE_URL: postgresql://synesis:synesis@localhost:5432/synesis_worker_test
      REDIS_URL: redis://localhost:6379
      SYNESIS_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @synesis/database db:migrate
      - run: pnpm --filter @synesis/database db:rollback
      - run: pnpm --filter @synesis/database db:migrate
      - run: pnpm test
      - run: pnpm --filter @synesis/web exec playwright install --with-deps chromium
      - run: pnpm --filter @synesis/web e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - run: pnpm build

  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/olas-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
