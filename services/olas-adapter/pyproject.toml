[project]
name = "synesis-olas-adapter"
version = "0.1.0"
description = "A narrow HTTP boundary between Synesis and the Olas Mech client."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.116.1",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synesis_olas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["synesis_olas"]
mypy_path = "src"
